name: Avatar
machineName: avatar
status: true
required: []
props:
  properties:
    image:
      title: Image
      type: object
      $ref: json-schema-definitions://canvas.module/image
      examples:
        - src: https://picsum.photos/seed/portrait-placeholder/200/200
          alt: Portrait placeholder
          width: 200
          height: 200
    placeholderText:
      title: Placeholder Text
      type: string
      examples:
        - AB
    size:
      title: Size
      type: string
      enum:
        - xs
        - sm
        - md
        - lg
        - xl
      meta:enum:
        xs: XS
        sm: SM
        md: MD
        lg: LG
        xl: XL
      examples:
        - md
    shape:
      title: Shape
      type: string
      enum:
        - circle
        - rounded
        - squircle
        - hexagon
        - triangle
      meta:enum:
        circle: Circle
        rounded: Rounded
        squircle: Squircle
        hexagon: Hexagon
        triangle: Triangle
      examples:
        - circle
    status:
      title: Status
      type: string
      enum:
        - none
        - online
        - offline
      meta:enum:
        none: None
        online: Online
        offline: Offline
      examples:
        - none
slots: {}
