name: Card
machineName: card
status: true
required: []
props:
  properties:
    variant:
      title: Variant
      type: string
      enum:
        - default
        - border
        - dash
      meta:enum:
        default: Default
        border: Border
        dash: Dash
      examples:
        - default
    title:
      title: Title
      type: string
      examples:
        - Card title
    titleElement:
      title: Title Element
      type: string
      enum:
        - h2
        - h3
        - h4
        - h5
        - h6
      meta:enum:
        h2: h2
        h3: h3
        h4: h4
        h5: h5
        h6: h6
      examples:
        - h2
    text:
      title: Text
      type: string
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - <p>A short description of what this card is about.</p>
    image:
      title: Image
      type: object
      $ref: json-schema-definitions://canvas.module/image
      examples:
        - src: https://picsum.photos/seed/card-placeholder/800/500
          alt: Card placeholder
          width: 800
          height: 500
    imagePosition:
      title: Image Position
      type: string
      enum:
        - top
        - bottom
        - side
        - responsive_side
        - overlay
      meta:enum:
        top: Top
        bottom: Bottom
        side: Side
        responsive_side: Responsive Side
        overlay: Overlay
      examples:
        - top
    size:
      title: Size
      type: string
      enum:
        - xs
        - sm
        - md
        - lg
        - xl
      meta:enum:
        xs: XS
        sm: SM
        md: MD
        lg: LG
        xl: XL
      examples:
        - md
slots:
  content:
    title: Content
  actions:
    title: Actions
