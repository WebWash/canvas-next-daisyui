name: Chat
machineName: chat
status: true
required:
  - placement
  - message
props:
  properties:
    placement:
      title: Placement
      type: string
      enum:
        - start
        - end
      meta:enum:
        start: Start
        end: End
      examples:
        - start
    message:
      title: Message
      type: string
      examples:
        - You were the chosen one!
    author:
      title: Author
      type: string
    time:
      title: Time
      type: string
    footerText:
      title: Footer Text
      type: string
    image:
      title: Image
      type: object
      $ref: json-schema-definitions://canvas.module/image
      examples:
        - src: https://picsum.photos/seed/portrait-placeholder/100/100
          alt: Portrait placeholder
          width: 100
          height: 100
    color:
      title: Color
      type: string
      enum:
        - default
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
      meta:enum:
        default: Default
        neutral: Neutral
        primary: Primary
        secondary: Secondary
        accent: Accent
        info: Info
        success: Success
        warning: Warning
        error: Error
      examples:
        - default
slots: {}
