name: Hero
machineName: hero
status: true
required: []
props:
  properties:
    variant:
      title: Variant
      type: string
      enum:
        - default
        - image
        - split
      meta:enum:
        default: Default
        image: Image
        split: Split
      examples:
        - default
    heading:
      title: Heading
      type: string
      examples:
        - Hello there
    headingElement:
      title: Heading Element
      type: string
      enum:
        - h1
        - h2
        - h3
      meta:enum:
        h1: h1
        h2: h2
        h3: h3
      examples:
        - h1
    text:
      title: Text
      type: string
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - <p>Provident cupiditate voluptatem et in. Quaerat fugiat ut assumenda excepturi.</p>
    backgroundImage:
      title: Background Image
      type: object
      $ref: json-schema-definitions://canvas.module/image
      examples:
        - src: https://picsum.photos/seed/background-placeholder/1600/900
          alt: Background placeholder
          width: 1600
          height: 900
    overlay:
      title: Overlay
      type: boolean
      examples:
        - false
    minHeight:
      title: Min Height
      type: string
      enum:
        - auto
        - half
        - screen
      meta:enum:
        auto: Auto
        half: Half
        screen: Screen
      examples:
        - auto
    alignment:
      title: Alignment
      type: string
      enum:
        - center
        - start
      meta:enum:
        center: Center
        start: Start
      examples:
        - center
    reverse:
      title: Reverse
      type: boolean
      examples:
        - false
slots:
  media:
    title: Media
  actions:
    title: Actions
