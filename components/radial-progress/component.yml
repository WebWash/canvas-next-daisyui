name: Radial Progress
machineName: radial-progress
status: true
required:
  - value
props:
  properties:
    value:
      title: Value
      type: integer
      examples:
        - 70
    label:
      title: Label
      type: string
    color:
      title: Color
      type: string
      enum:
        - default
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
      meta:enum:
        default: Default
        neutral: Neutral
        primary: Primary
        secondary: Secondary
        accent: Accent
        info: Info
        success: Success
        warning: Warning
        error: Error
      examples:
        - default
    size:
      title: Size
      type: string
      enum:
        - sm
        - md
        - lg
      meta:enum:
        sm: SM
        md: MD
        lg: LG
      examples:
        - md
    thickness:
      title: Thickness
      type: string
      enum:
        - thin
        - normal
        - thick
      meta:enum:
        thin: Thin
        normal: Normal
        thick: Thick
      examples:
        - normal
slots: {}
