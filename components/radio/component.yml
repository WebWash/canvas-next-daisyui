name: Radio
machineName: radio
status: true
required:
  - label
  - options
props:
  properties:
    label:
      title: Label
      type: string
      examples:
        - T-shirt size
    hideLabel:
      title: Hide Label
      type: boolean
      examples:
        - false
    description:
      title: Description
      type: string
    name:
      title: Name
      type: string
    required:
      title: Required
      type: boolean
      examples:
        - false
    disabled:
      title: Disabled
      type: boolean
      examples:
        - false
    options:
      title: Options
      type: array
      items:
        type: string
      examples:
        - - Small
          - Medium
          - Large
    value:
      title: Value
      type: string
    color:
      title: Color
      type: string
      enum:
        - default
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
      meta:enum:
        default: Default
        neutral: Neutral
        primary: Primary
        secondary: Secondary
        accent: Accent
        info: Info
        success: Success
        warning: Warning
        error: Error
      examples:
        - default
    size:
      title: Size
      type: string
      enum:
        - xs
        - sm
        - md
        - lg
        - xl
      meta:enum:
        xs: XS
        sm: SM
        md: MD
        lg: LG
        xl: XL
      examples:
        - md
slots: {}
